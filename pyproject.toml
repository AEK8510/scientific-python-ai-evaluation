[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-python-ai-evaluation"
version = "0.1.0"
description = "Deterministic evaluation utilities for AI-generated scientific and Python outputs."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Ahmed El Kerim"}
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
